name: Update public portfolio statistics

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh public portfolio snapshot
        run: python scripts/profile_stats.py --refresh
      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/portfolio-stats.json profile/portfolio-stats*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(profile): refresh public portfolio statistics"
          git push
